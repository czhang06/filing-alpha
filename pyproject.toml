[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-alpha"
version = "0.1.0"
description = "Event study of SEC 8-K filings against market-adjusted returns"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# The FinBERT scorer (`--scorer finbert`). Large: torch plus ~500 MB of weights.
finbert = ["torch>=2.2", "transformers>=4.40"]

[project.scripts]
filing-alpha = "filing_alpha.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
